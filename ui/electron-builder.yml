appId: com.tts.studio
productName: TTS Studio
directories:
  output: ../installer
  buildResources: build
extraResources:
  - from: ../backend/dist/tts_backend
    to: backend
files:
  - dist/**/*
  - dist-electron/**/*
win:
  target: nsis
  icon: public/favicon.ico
  forceCodeSigning: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TTS Studio
